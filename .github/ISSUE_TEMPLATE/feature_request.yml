name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的实际问题，而不是只写实现方案。
        涉及绕过登录、付费、验证码或访问控制的建议不会实现。

  - type: dropdown
    id: platform
    attributes:
      label: 适用平台
      options:
        - Windows 桌面版
        - Android 版
        - 两者都要

  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的问题
      placeholder: 描述使用场景和具体不便之处
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这个建议不涉及绕过平台访问控制
          required: true
