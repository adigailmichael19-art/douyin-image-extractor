name: Bug 反馈
description: 报告桌面版或 Android 版的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，避免重复。
        提交前请删掉日志里的 Cookie、Token、手机号和本机路径。

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 桌面版
        - Android 版
        - 两者都有
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 桌面版看窗口标题，Android 版看系统设置里的应用信息
      placeholder: 例如 Android 1.7（versionCode 8）/ Windows 源码运行
    validations:
      required: true

  - type: input
    id: link_type
    attributes:
      label: 链接类型
      description: 不用贴真实链接，说明类型即可
      placeholder: 短链 / 完整链接 / App 分享口令

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 粘贴链接 ……
        2. 点击开始提取 ……
        3. 出现 ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（已删除敏感信息）
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue
          required: true
        - label: 内容里不含 Cookie、Token 或他人个人信息
          required: true
