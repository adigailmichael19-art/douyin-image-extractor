name: Import verified source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-1.7-merge

      - name: Download verified tree
        run: |
          curl -fsSL -o /tmp/src.zip "https://aka.doubaocdn.com/s/fmk1yV72q2"
          unzip -o /tmp/src.zip -d .

      - name: Commit imported tree
        run: |
          git rm .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Android 1.7 source tree"
          git push origin HEAD:android-1.7-merge
