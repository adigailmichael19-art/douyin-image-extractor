name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          mkdir -p "$HOME/.gradle-dist"
          curl -fsSL -o "$HOME/.gradle-dist/gradle-8.7-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$HOME/.gradle-dist/gradle-8.7-bin.zip" -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: douyin-extractor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to debug Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release create android-debug \
            --prerelease \
            --title "Android debug APK" \
            --notes "Automated debug build from main. Signed with the Android debug key; use for personal learning and testing only." \
            "$APK" || \
          gh release upload android-debug "$APK" --clobber
