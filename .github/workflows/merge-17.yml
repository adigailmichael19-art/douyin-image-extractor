name: Merge Android 1.7

on:
  push:
    paths:
      - '.github/workflows/merge-17.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge verified branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin android-1.7-merge
          git merge --no-ff --no-commit origin/android-1.7-merge
          git rm -f .github/workflows/merge-17.yml || true
          git commit -m "Merge Android 1.7: anonymous ttwid HTTP extraction, auto PDF and gallery export"
          git push origin HEAD:main
