name: Repo metadata (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.repo-meta-trigger'

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update description and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit \
            --description 'Windows 桌面版 + 原生 Android 版的抖音图文/视频保存工具：批量提取原图与文案、可选 MP4，自动合成 PDF 并导出相册。' \
            --add-topic douyin --add-topic python --add-topic tkinter \
            --add-topic android --add-topic java --add-topic pdf --add-topic desktop-app \
            || echo 'metadata update skipped: token lacks admin permission'
          gh repo view --json description,repositoryTopics

      - name: Delete merged branch
        run: |
          git push origin --delete android-1.7-merge || echo 'branch already deleted'
